version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      mcp-deps:
        patterns:
          - "@modelcontextprotocol/*"
      dev-tools:
        patterns:
          - "@biomejs/*"
          - "@commitlint/*"
          - "@changesets/*"
          - "lefthook"
          - "typescript"
          - "vite*"
